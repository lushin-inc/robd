:root{
 --bg:#f1f2f4; --text:#1d2025; --muted:#646a73; --line:#d9dce1; --field:#fafbfc;
 --accent:#2c56c9; --accq:rgba(44,86,201,.10); --card:#ffffff; --on:#eef2fd;
 --bar:#1b1f27; --bart:#eef1f6; --barm:#aeb5c1; --ont:#fff; --grad:linear-gradient(135deg,#2c56c9,#5b3fc4);
}
:root[data-theme="dark"]{
 --bg:#121418; --text:#e9ecf1; --muted:#9aa2ae; --line:#2b3038; --field:#1a1d22;
 --accent:#86a4ff; --accq:rgba(134,164,255,.14); --card:#181b20; --on:#1d2433;
 --bar:#0b0d10; --bart:#eef1f6; --barm:#9aa2ae; --ont:#0f1320; --grad:linear-gradient(135deg,#3b62d6,#6a4fd6);
}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]){
  --bg:#121418; --text:#e9ecf1; --muted:#9aa2ae; --line:#2b3038; --field:#1a1d22;
  --accent:#86a4ff; --accq:rgba(134,164,255,.14); --card:#181b20; --on:#1d2433;
  --bar:#0b0d10; --bart:#eef1f6; --barm:#9aa2ae; --ont:#0f1320; --grad:linear-gradient(135deg,#3b62d6,#6a4fd6);
 }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--text);
 font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
 font-size:16px;line-height:1.5;overflow-x:clip;min-height:100vh;-webkit-font-smoothing:antialiased;
 padding-bottom:160px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.wrap{max-width:736px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
 backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
 border-bottom:1px solid var(--line);padding:9px 16px;padding-top:calc(9px + env(safe-area-inset-top,0px))}
.topin{max-width:736px;margin:0 auto;display:flex;align-items:center;gap:11px;min-height:40px}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--grad);color:#fff;flex:0 0 auto}
.brand{flex:1;min-width:0;font-size:17px;font-weight:500;letter-spacing:-.3px}
.tt{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.search{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--field);
 border-radius:10px;padding:0 12px;margin:16px 0 12px;color:var(--muted)}
.search input{min-width:0;width:100%;background:transparent;color:var(--text);border:0;padding:13px 0;font:inherit;font-size:16px;outline:none}
.search input::placeholder{color:var(--muted);opacity:1;font-size:14px}
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;text-align:center;padding:9px 2px;border-radius:7px;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--ont)}
.chips{display:flex;flex-wrap:nowrap;gap:6px;margin:4px -16px 6px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.chips[hidden]{display:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;white-space:nowrap;font-size:13px;padding:6px 11px;border-radius:999px;background:var(--field);border:1px solid var(--line);color:var(--muted)}
.chip.on{background:var(--accq);border-color:var(--accent);color:var(--accent)}
.bar2{display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px;gap:10px;min-height:24px}
.bar2 .lbl{font-size:13px;color:var(--muted)}
.bar2[hidden]{display:none}
.playall{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--accent);font-weight:500;white-space:nowrap}
.playall[hidden]{display:none}
.ch{font:500 13px/1.4 Inter,sans-serif;color:var(--accent);margin:24px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.list{list-style:none;padding:0;margin:0}
.clip{border-bottom:1px solid var(--line)}
.list .clip:last-child{border-bottom:0}
.row{display:flex;gap:12px;align-items:flex-start;width:100%;padding:14px 0}
.pb{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accq);color:var(--accent);flex:0 0 auto;margin-top:1px}
.pb svg{width:16px;height:16px;fill:currentColor;stroke:none}
.clip.on .pb{background:var(--accent);color:var(--ont)}
.tx{flex:1;min-width:0}
.ti{display:block;font-size:15.5px;line-height:1.45;font-weight:500}
.clip.done .ti{color:var(--muted);font-weight:400}
.mt{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:3px;font-size:12px;color:var(--muted)}
.mt .best{color:var(--accent)}
.st{color:var(--muted);padding:9px 2px 0}
.st.on{color:var(--accent)}
.st.on svg{fill:currentColor}
.more{display:none;padding:0 0 14px 50px}
.clip.open .more{display:block}
.kw{margin:0 0 8px;font-size:14.5px;line-height:1.55}
.acts{display:flex;flex-wrap:wrap;gap:16px;font-size:13.5px}
.acts button{color:var(--accent)}
.empty{color:var(--muted);font-size:14px;padding:30px 0;text-align:center}
.snip{display:block;margin-top:5px;font-size:13.5px;line-height:1.5;color:var(--muted)}
mark{background:var(--accq);color:var(--text);border-radius:3px;padding:0 2px}
.momh{font-size:19px;font-weight:600;letter-spacing:-.3px;margin:34px 0 2px}
.momsub{font-size:13px;color:var(--muted);margin:0 0 6px}
.mom .ti{font-weight:400;font-size:15px}
.morebtn{color:var(--accent);font-size:14px;padding:14px 0}
/* learning layout */
.h2{font-size:19px;font-weight:600;letter-spacing:-.3px;margin:26px 0 10px}
.flow{list-style:none;margin:0;padding:0}
.stg{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.stg:first-child{margin-top:0}
.fl{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;min-height:52px}
.fn{width:26px;height:26px;border-radius:8px;background:var(--grad);color:#fff;font-size:13px;font-weight:500;display:grid;place-items:center;flex:0 0 auto}
.ft{flex:1;min-width:0;font-size:15px;font-weight:500;line-height:1.35}
.fl svg{color:var(--muted)}
.con{display:block;width:2px;height:10px;background:var(--line);margin:-6px 0 0 26px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 12px;overflow:hidden}
.sech{display:flex;align-items:center;gap:12px;width:100%;padding:16px}
.sech .fn{width:32px;height:32px;border-radius:10px;font-size:14px}
.secn{flex:1;min-width:0;font-size:17px;font-weight:600;letter-spacing:-.2px;line-height:1.3}
.chev{transition:transform .2s;color:var(--muted)}
.sec.open .chev{transform:rotate(180deg)}
.secb{display:none;padding:0 16px 6px}
.sec.open .secb{display:block}
.what{margin:0 0 14px;font-size:15px;line-height:1.6}
.lab{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.how{list-style:none;margin:0 0 16px;padding:0}
.how li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:15px;line-height:1.5}
.how .ck{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);flex:0 0 auto;display:grid;place-items:center;margin-top:1px;color:transparent}
.how li.ok .ck{background:var(--accent);border-color:var(--accent);color:var(--ont)}
.how li.ok span{color:var(--muted);text-decoration:line-through}
.how .ck svg{width:14px;height:14px}
.robh{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.robh .lab{margin:0}
.start{background:var(--grad);color:#fff;border-radius:16px;padding:20px;margin:16px 0 4px;display:flex;align-items:center;gap:14px;width:100%;box-shadow:0 8px 24px rgba(60,80,200,.25)}
.start .big{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:0 0 auto}
.start .big svg{width:22px;height:22px;fill:#fff}
.start b{display:block;font-size:18px;font-weight:600;letter-spacing:-.2px}
.start span{font-size:13.5px;opacity:.85}
/* player */
.player{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bar);color:var(--bart);
 padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.18)}
.player[hidden]{display:none}
.pin{max-width:736px;margin:0 auto}
.pt{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

rm","s":"Welcome to Existence, My Time Intelligence Platform","file":"Welcome to Existence, My Time Intelligence Platform.mp4","d":86.15},{"k":"v25","n":"Why I Started Measuring My Life in Percentages","s":"Why I Started Measuring My Life in Percentages","file":"Why I Started Measuring My Life in Percentages.mp4","d":96.83},{"k":"v26","n":"Why Motivation Isn't Enough","s":"Why Motivation Isn't Enough","file":"Why Motivation Isn't Enough.mp4","d":166.97},{"k":"v27","n":"Why Your Most Important Memories Fade","s":"Why Your Most Important Memories Fade","file":"Why Your Most Important Memories Fade.mp4","d":79.3},{"k":"v28","n":"You Are the Visionary of You","s":"You Are the Visionary of You","file":"You Are the Visionary of You.mp4","d":122.55},{"k":"v29","n":"You Can Do Everything Right and Still Feel Terrible","s":"You Can Do Everything Right and Still Feel Terrible","file":"You Can Do Everything Right and Still Feel Terrible.mp4","d":174.8},{"k":"v30","n":"You Don’t Find Your Passion. You Create it.","s":"You Don’t Find Your Passion. You Create it.","file":"You Don’t Find Your Passion. You Create it..mp4","d":176.05},{"k":"v31","n":"You Only Do 15 to 25 Things a Day","s":"You Only Do 15 to 25 Things a Day","file":"You Only Do 15 to 25 Things a Day.mp4","d":165.65},{"k":"v32","n":"You Will Never Fully Understand Yourself","s":"You Will Never Fully Understand Yourself","file":"You Will Never Fully Understand Yourself.mp4","d":147.33},{"k":"v33","n":"Your Daily Patterns Shape Who You Become","s":"Your Daily Patterns Shape Who You Become","file":"Your Daily Patterns Shape Who You Become.mp4","d":153.04},{"k":"v34","n":"Your Energy is Trying to Tell You Something","s":"Your Energy is Trying to Tell You Something","file":"Your Energy is Trying to Tell You Something.mp4","d":143.71},{"k":"v35","n":"Your Life is an Operating System","s":"Your Life is an Operating System","file":"Your Life is an Operating System.mp4","d":109.78},{"k":"v36","n":"How To OPTIMIZE & DESIGN Your Dream Life! ¦ Rob Dyrdek & Lewis Howes","s":"How To OPTIMIZE & DESIGN Your Dream Life!","file":"How To OPTIMIZE & DESIGN Your Dream Life! ¦ Rob Dyrdek & Lewis Howes.mp4","d":1561.47},{"k":"v37","n":"How to AVOID Your Next BURNOUT w Rob Dyrdek","s":"How to AVOID Your Next BURNOUT","file":"How to AVOID Your Next BURNOUT w Rob Dyrdek.mp4","d":3620.97},{"k":"v38","n":"Rob Dyrdek on Designing a Desirable Life","s":"on Designing a Desirable Life","file":"Rob Dyrdek on Designing a Desirable Life.mp4","d":2914.78},{"k":"v39","n":"Rob Dyrdek; The Mindset That Built a Billion-Dollar Life","s":"The Mindset That Built a Billion-Dollar Life","file":"Rob Dyrdek; The Mindset That Built a Billion-Dollar Life.mp4","d":3317.27},{"k":"v40","n":"Rob Dyrdek’s System For Controlling Time","s":"’s System For Controlling Time","file":"Rob Dyrdek’s System For Controlling Time.mp4","d":327.61},{"k":"v41","n":"The Man Who Tracks Every Second Of His Life - Rob Dyrdek","s":"The Man Who Tracks Every Second Of His Life","file":"The Man Who Tracks Every Second Of His Life - Rob Dyrdek.mp4","d":5857.47}],"clips":[{"id":"600e30","s":0.0,"e":109.78,"cat":"os","r":3,"t":"Your life already runs as a system","k":"Rob says your repeated actions, environments, decisions and people form a system that is perfectly designed to produce your current results. You are the goal, so treat every improvement as an upgrade to the system that outputs you.","q":"operating system, system of you, habits, results, James Clear, upgrade, best version","b":"v35","g":"1tO8T0NqpiAPO_P07W9qwnfCQ-66R_glc"},{"id":"068b82","s":2857.94,"e":2924.83,"cat":"os","r":2,"t":"Your system drifts toward least effort","k":"Everyone already runs a system, and we all drive it toward the least effort, so if you get extraordinary at chips and Netflix every night, you created that result. The longer it runs the harder it is to redesign, and you cannot change one part of your life without changing all of it.","q":"machine mindset, operating system, living system, least effort, redesign, harmony, change everything, default system","b":"v39","g":"1cBa7vJOaYbBhjg-vJm_5F8BHrUGyGiyW"},{"id":"fc3caf","s":4295.16,"e":4390.71,"cat":"os","r":1,"t":"No single change will fix a bad system","k":"Hopeless people swing between reacting, doing nothing, worrying and dwelling, with no effort to design a better future, and their system of habits keeps them there. They keep thinking one thing away (a relationship, a job, a seminar) will fix it, but you cannot change one part of you without redesigning the whole.","q":"operating system, system of systems, sorrow triangle, worry, dwelling, one thing away, design the whole","b":"v41","g":"1FHmcO-850rWc2uIey6rv9nraQkA0sy6g"},{"id":"0b73c9","s":0.0,"e":96.8,"cat":"pillars","r":3,"t":"Measure balance as percentages across pillars","k":"Rob says he only became balanced once he saw his time as percentages across work, health, life and sleep, settling on a mix that felt right for him. Look at those percentages by day, week and month to see your rhythm and whether you are staying balanced.","q":"four pillars, percentages, balance, work, health, life, sleep, day week month","b":"v25","g":"1jY8O5A_b-qrHDe_bc-stbVnKfehvhNuy"},{"id":"72a629","s":0.21,"e":94.82,"cat":"pillars","r":2,"t":"Balance is the real you living by design","k":"Rob says fulfillment starts with accounting for all your time so you can see whether the real you matches the ideal you. Using his own week of work, deep work, travel, hikes, date night and family, he shows real balance is an uneven, personal mix you design with intention and then live.","q":"balance, four pillars, real you, ideal you, account for all your time, fulfillment, design","b":"v12","g":"18yXhPFHVNHE-v0Xv9lw0d6GGVTzA6QJJ"},{"id":"d8fffe","s":4.85,"e":82.04,"cat":"pillars","r":1,"t":"Seeing a year as hours across four pillars","k":"Rob describes building a 2015 spreadsheet modeled on his company's meeting cadence, which led him to see his life as sleep, work, life and health. Viewing time as 168 hours a week across those pillars shows how you create yourself and how much control you have.","q":"four pillars, sleep, work, life, health, 168 hours, rhythm of existence, capacity","b":"v20","g":"1Rwjp28d5ZMfBj_p4TJmm3TGnVY2TcFWL"},{"id":"1e4ded","s":0.0,"e":165.65,"cat":"blocks","r":3,"t":"You only do 15 to 25 things a day","k":"Rob walks through an ordinary day to show it was all your own creation: each day is 15 to 25 time blocks, and only six or seven kinds of activity repeat through the week. Once you see that structure, design each block on purpose to create the person you want to become.","q":"time blocks, 15 to 25 things, six or seven activities, structure of time, repeat, design, intention","b":"v31","g":"1WOZ5aR5ub6J0HP9sIF9vB44UzaBqrAV9"},{"id":"af9dfc","s":52.24,"e":131.88,"cat":"blocks","r":2,"t":"Each time block has two layers","k":"Rob defines a time block as two layers: objective time (when, what, where and who, which you plan ahead and account for afterward) and experience time (how it felt, what it meant and what to remember, added once it is lived). Together the two layers turn each block into a record of the real you.","q":"time block, objective time, experience time, two layers, plan, reflection, rating, record","b":"v23","g":"1kz7DfpErDaOTAv_0am9SqrLgnMeCikTn"},{"id":"c6736e","s":0.05,"e":74.16,"cat":"account","r":3,"t":"Account for all your time, not just important time","k":"Rob argues the quality of your time is the quality of your life, yet most people only track their important time. Accounting for every hour, sorted into pillars and rated for quality, reveals the real you and how time is shaping you.","q":"time accountability, account for all your time, quality of time, real you, pillars, insight","b":"v24","g":"1SSzRt68JwZAOcbgOCJAlP8gxjpB3Kpkf"},{"id":"22dac0","s":502.52,"e":617.76,"cat":"account","r":2,"t":"Tag every hour and see it as percentages","k":"Rob built a rhythm of the year around constants like weekends, holidays and birthdays, then tagged every hour of his day and had a script turn his calendar into a dashboard. Seeing hours as a share of the 8,760 in a year (one daily hour is 4 percent, a 40-hour week is 23 percent) makes you question how well each use of time pays off.","q":"account for time, tag every hour, 8760 hours, percentage of life, time matrix, rhythm of the year, calendar dashboard","b":"v37","g":"1waS0Tqd2oxhArok3gT25C4OI8OCUgeYg"},{"id":"682b3c","s":0.0,"e":52.49,"cat":"account","r":2,"t":"Unaccounted time fades and hides who you are","k":"Rob points out that every experience happens inside a unit of time with a what, who and where, but once it ends the details disappear. If you do not account for your time, the person that time is creating stays hidden from you.","q":"account for time, unit of time, memory fades, unaccounted time, real you, experiences","b":"v23","g":"1Lh-fi9HEGZCQKh-uBeTheMZq-T2HnaAe"},{"id":"dd0cac","s":0.0,"e":174.67,"cat":"energy","r":3,"t":"Rate every block's energy from 0 to 10","k":"Doing exactly what you planned can still feel terrible, as Rob's day ruined by a hyperbaric session before a shoot showed. So after each block, rate the experience 0 to 10, not as a productivity score; below five is negative, above five positive, and the patterns show which people, places and activities to design around.","q":"energy rating, 0 to 10 scale, time block, quality of experience, not productivity, patterns, energy compass","b":"v29","g":"1NvTegBMKitQoc5fiqnUFXw00e0xr3v44"},{"id":"172967","s":2652.45,"e":2714.64,"cat":"energy","r":2,"t":"A repeated low score means fix or stop","k":"Rob rates his life, work and health from 0 to 10 every day, and when the low numbers keep tracing to the same cause he either builds a solution, builds a system, or stops doing it. Running that loop everywhere keeps him in a steady state of high energy, which he sees as the point: mastering time and whatever drains your energy so you can be happy consistently.","q":"daily rating, zero to ten, life work health, low score, remove drains, happiness, energy","b":"v38","g":"1803-pqVnNElC7kgkpPqRv5kjl33vfB7k"},{"id":"8be9f4","s":1173.8,"e":1297.4,"cat":"energy","r":2,"t":"A year of ratings proved habits lift life quality","k":"Rob rates life, work and health from 0 to 10 daily (30 possible) and also tracks a core set of habits: up at five, brain training, gym, meditation, clean eating, no drinking. His 2020 data showed an 18.2 average with 56 percent habit compliance, so he committed to 80 percent compliance in 2021, hit 92 percent and averaged 21.4; pair your daily ratings with habit tracking and let the data show what moves your quality of life.","q":"zero to ten rating, life work health score, qualitative data, quantitative habits, gamify discipline, core habits, habit tracking, quality of life","b":"v39","g":"1pUiYWQdp2kIhnuTWu9K7GazRNr0IXTr6"},{"id":"056d0b","s":0.0,"e":150.01,"cat":"energy","r":2,"t":"Low scores hold the information for change","k":"Rob recalls the first day he scored sleep, life, work and health from 0 to 10, and explains that putting a number on a feeling forces you to ask why you feel that way. Treat 5 as neutral, 6 and up as positive, and 4 and below as the place where the information for change lives.","q":"energy rating, zero to ten, qualitative data, five is neutral, four and below, quality of life, self-awareness","b":"v19","g":"1BFLf-L0nRvGvQI3-cUOA2BbGoBlw7rFy"},{"id":"de3f21","s":0.0,"e":143.71,"cat":"energy","r":2,"t":"Your energy is a compass toward the ideal you","k":"How you feel is the combined result of the people, work, environment and thoughts around you, so treat it as information instead of pushing through. Move toward what creates high energy and away from what drains you, aiming for more high-energy time overall.","q":"energy, compass, low energy, high energy, information of change, people places activities, ideal you","b":"v34","g":"1G9sfzWvGlK5IUIDNexYR9u6dbcU8zoyQ"},{"id":"008452","s":2550.89,"e":2601.41,"cat":"energy","r":1,"t":"Never argue with how your spouse feels","k":"Rob asks his wife to rate their relationship 0 to 10 every day, and some days she gives him a zero or a one. He never questions why she feels that way; he works to understand the reason and make sure she does not feel that way again, which he credits for how strong the marriage has grown.","q":"relationship score, zero to ten, wife, marriage, feelings as information, don't argue, energy rating","b":"v39","g":"1XUPKfFmlqv6IO8bk9oASzfya7NreNC_-"},{"id":"abd376","s":0.21,"e":79.3,"cat":"record","r":3,"t":"Reflections keep the meaning of time from fading","k":"Rob explains that the details and meaning of experiences fade, so he adds a written reflection to the time block itself: what you learned, what stood out, what changed your view. Because it is tied to the lived moment, it becomes part of the record of you rather than a separate journal.","q":"reflection, record, memories fade, meaning, context, journal, time block","b":"v27","g":"1HvOcOZNLseSntR6z6bGDDgiIbCPqs7ub"},{"id":"6498bd","s":2.45,"e":113.58,"cat":"record","r":2,"t":"Count the life you have created in units","k":"Inspired by the life-in-weeks calendar, Rob counts his life in years, months, weeks and days created, back to his very first time block at birth. Backfill the meaningful moments of your past so the record tells the true story of who you have created.","q":"existence grid, life in weeks, years months weeks days, record, backfill, past moments, story of you","b":"v18","g":"1zWuqxlSsQMq7Mhh8NmH66iEAdv5pKJeL"},{"id":"009bf7","s":82.42,"e":156.32,"cat":"record","r":1,"t":"Rate, reflect and add photos to each block","k":"As the week unfolds, account for each block: rate its quality, write a reflection on meaningful moments, and attach a photo or video so it becomes a memory. Together these turn your lived time into a deep record of who you are actually creating.","q":"account for time, reflection, photo, memory, energy rating, record, time block, lived experience","b":"v16","g":"1u6ZVATgTOUjjHg20j4UXUgyqIqM2R-Zo"},{"id":"3a80cd","s":200.72,"e":259.1,"cat":"friction","r":3,"t":"Automate your life with a written operating manual","k":"Rob's chief of staff and assistants run his life from an 80-page document, the Rhythm of Existence, covering food, housekeeping, travel, haircuts, family agendas, date nights and even which plumber to call. Create the system, automate it so it runs by itself, then optimize it, because greatness comes from optimizing after you automate.","q":"rhythm of existence, life operating manual, create automate optimize, chief of staff, delegate, friction, systems","b":"v36","g":"1AwC6QfSjGos6A3S4CatnM5oQwpgMnmJN"},{"id":"4af2cc","s":122.42,"e":142.89,"cat":"friction","r":3,"t":"Hunt friction and build a system to remove it","k":"Rob hunts friction all day, and every time he finds some he creates a solution or system to eliminate it. Doing this keeps both his life and his mind in a balanced, optimized state.","q":"hunt friction, friction, systems, solution, optimize, balanced mind, create automate optimize","b":"v14","g":"1R9uJgqyvCM4QLR3ztNeYk4PZqVLeDO8o"},{"id":"302f5d","s":158.72,"e":184.38,"cat":"friction","r":2,"t":"Only do things that give you energy","k":"Rob decided to stop doing anything that takes energy from him. For any draining task there are three options: learn it so well it takes less effort, automate it, or hire someone to do it.","q":"energy, draining tasks, learn it, automate, hire, delegate, friction, energy neutral","b":"v36","g":"1HtoDjnyhVj1WT38KXpzJ_IG___c8uEqJ"},{"id":"9a3a29","s":3000.78,"e":3098.08,"cat":"friction","r":2,"t":"Systems that remove friction from a marriage","k":"One date night was not enough, so Rob and his wife run a weekly rhythm: Monday talk night, Wednesday breakfast, Thursday movie night, Friday sushi. When she felt uninformed, he started a daily morning email of his schedule with a love quote, which his assistant now builds from his calendar.","q":"relationship systems, marriage, date night rhythm, friction, automation, morning email, integrate family","b":"v37","g":"1pMWPx_GMMkJlQyqlnD7XBK3kq76MJYQ6"},{"id":"713b67","s":1427.37,"e":1553.06,"cat":"friction","r":2,"t":"Drive everything in life toward energy neutral","k":"Rob runs all his work on about 22 percent of his time, less than a nine to five at 27 percent, because every part of it is automated. He looks at the rest of life the same way, asking how to systematize or automate each thing until it is energy neutral and takes no mind share, from meals and supplements to travel and the house.","q":"automation, energy neutral, mind share, systems, 22 percent work time, chief of staff, friction","b":"v41","g":"17bp1ZRsHr-SyhASH7ohRM_8TMEaAKmQH"},{"id":"4dd75b","s":842.18,"e":970.33,"cat":"friction","r":1,"t":"Drive everything to automation to remove friction","k":"Rob drives everything in his life toward automation and answers each bit of friction with a system or solution. Shooting 60 episodes a year was tearing the soul out of him, so he chipped away at every inefficiency until a three-hour prep drive became a 15-minute online review.","q":"automation, friction, system or solution, efficiency, optimize, energy drain, create automate optimize","b":"v37","g":"1jpF2IKa6y6kEglqlYHHFVy2g5uR8inym"},{"id":"b57aa5","s":1565.81,"e":1637.16,"cat":"friction","r":1,"t":"Your first hire should be an assistant","k":"Rob says the number one hire anyone makes is an assistant, someone whose job is to hand back time and energy by absorbing errands and surprises like a water leak. How much they help depends on how you design their work, so build systems that make them consistent instead of spending your time feeding them tasks.","q":"assistant, first hire, delegate, buy back time, mind share, systems, friction","b":"v41","g":"1XEu1ZSDAb14uLkxgHTTvn0TU06m60GzR"},{"id":"03c73e","s":0.0,"e":121.94,"cat":"align","r":3,"t":"The gap between ideal you and real you","k":"Rob calls the drift between who you intend to become and who your time actually creates time disconnect, caused by lack of visibility, not laziness. Design the week as the ideal you, account for how it was lived, treat the gap as information, and adjust next week's design.","q":"time disconnect, ideal you, real you, gap, intention, visibility, weekly design, adjust","b":"v21","g":"1rc6D1d5T3UUcugFHaaOlL-1H71bcihIh"},{"id":"8b5912","s":0.0,"e":34.42,"cat":"align","r":2,"t":"The time alignment score measures intention against creation","k":"Each week you set how you intend to split your time across the four pillars, account for what you actually lived, and the score measures the gap between intention and creation. The weekly recap shows which pillar you missed and what to change in your next design.","q":"time alignment score, intention, creation, four pillars, weekly recap, real me vs ideal me, design","b":"v10","g":"1YRpX4DXJTacMH5arormg3fONCpO9Mnb3"},{"id":"7811de","s":0.05,"e":78.79,"cat":"align","r":2,"t":"Missing your plan in either direction lowers alignment","k":"Rob designs his whole week across life, work, health and sleep, so the score is tied to that intention. He got an 89 because he worked less and spent eight extra hours with family; even good extra time counts as a miss when it was not the plan.","q":"time alignment score, ideal me, design the week, four pillars, time blocking, intention, miss in either direction","b":"v13","g":"1JTsCXi9-sKSiODY4l-LnRqMHADFkpE2w"},{"id":"6d1e5a","s":0.0,"e":163.82,"cat":"week","r":3,"t":"Life is built week by week","k":"Seeing each week as a new version of you makes improvement manageable and gives you a reset every Monday. Run the cycle: set intention across the four pillars, account for time as you live it, then use what it shows to design a better next week; small weekly adjustments compound.","q":"win the week, time creation cycle, design account optimize, weekly reset, four pillars, compounding, intention","b":"v07","g":"1WGNGcvx_H2LpxW_JHroEWvZ4D-t-8qZd"},{"id":"c9346b","s":119.2,"e":160.1,"cat":"week","r":2,"t":"An off week does not define you; reset","k":"A bad week is not who you are; the weekly cycle lets you reset completely, and Rob locked back in the next week. Being off sometimes is fine; what matters is how fast you rebound into alignment.","q":"weekly reset, rebound, off week, time creation cycle, alignment, lock back in, consistency","b":"v03","g":"1t5uk6VIVMhYPx57UMBuoumIKeL60QdfB"},{"id":"421ca7","s":1215.22,"e":1313.51,"cat":"week","r":2,"t":"Rob's Monday reset sets the whole week","k":"Rob starts Mondays at 4:30 and reviews one master hot sheet covering his personal life and every division, then meets his chief of staff, his COO and each division head in turn. By the end of Monday everything is reset and the week's goals and meetings are set, replacing scattered standing meetings with focused, planned time.","q":"Monday reset, hot sheet, weekly planning, set the week, visibility, routine, standing meetings","b":"v36","g":"1GkaU-jfNdlfxwu3qceyv3GY5zr0FkfJf"},{"id":"c68f33","s":1973.72,"e":2000.05,"cat":"week","r":1,"t":"Keep one weekday clear for execution only","k":"After organizing every Monday around short meetings with each executive, Rob cleared Tuesdays entirely for execution, catching up and free thinking. Meetings only go in the remaining three days, inside the 30 percent of his time he allots to work.","q":"weekly design, execution day, clear Tuesdays, meeting-free day, work allotment, 30 percent, schedule design","b":"v39","g":"1CU6LCKFUbKWNyNatUstd7iswqook1Mlh"},{"id":"37f77f","s":0.0,"e":166.95,"cat":"rhythm","r":3,"t":"Put goals inside your rhythm, not motivation","k":"Bursts of motivation and drastic new habits fade and you fall back into your usual patterns, which are your natural rhythm. Integrate the goal into that rhythm so consistent progress, not motivation, builds the belief and momentum that carry you to it.","q":"rhythm, motivation, consistency, habits, progression, momentum, goals, burnout","b":"v26","g":"120Xh3hyPd5-TUBJJcXie9_bWqYThH-WV"},{"id":"1e15d5","s":12.45,"e":153.04,"cat":"rhythm","r":3,"t":"Your rhythm of repeated patterns creates you","k":"Rob says your life already runs in a rhythm of repeated activities across work, health, life and sleep, which he noticed while building a company operating cadence. Get intentional about that rhythm: it becomes consistency, then discipline, then mastery, and let it evolve as your goals and responsibilities change.","q":"rhythm, patterns, consistency, discipline, mastery, cadence, rhythm of company, ordinary moments","b":"v33","g":"1FKJp84VnLF3P_eE0LbThRMgW4ZyVAKXm"},{"id":"ed2765","s":0.61,"e":96.18,"cat":"rhythm","r":2,"t":"Doubt starts when friction slows your momentum","k":"Slowing down brings anxiety, stalling costs faith, sliding back costs belief, and people only quit once belief is gone. Doubt begins with friction, which is just information, so when progress slips, find the biggest source of resistance and remove it.","q":"momentum, friction, stages of doubt, belief, quit, progress, rhythm, information","b":"v05","g":"1Q32zi7KxDW0ImTIs6K3aZmfLX6SUKhig"},{"id":"1147a6","s":2209.9,"e":2346.29,"cat":"rhythm","r":2,"t":"Discipline is just being intentional with the whole","k":"Rob says discipline sounds harsh, but at its core it is just being intentional, and the aim is for it to stop being something you even consider. His data showed when he felt best, sharpest and most present, and he argues you cannot discipline one isolated part of life: design the whole with intention and live the whole with discipline.","q":"discipline, intentional, discipline is destiny, whole life, integration, presence, way of being, data","b":"v41","g":"1xssZ87FLLt-JylALp0oUBv6gdrzfQq0T"},{"id":"43b541","s":1856.39,"e":1930.14,"cat":"rhythm","r":1,"t":"Peak top is a permanent shift into discipline","k":"Rob coined peak top for the opposite of rock bottom: after years of slowly getting more disciplined and seeing the data, something shifted and he asked why he would ever not feel amazing. Since then he has not missed a single day of his core habits, so let gradual, measured discipline build toward that permanent change.","q":"peak top, rock bottom, discipline, habits, permanent change, core seven, consistency, mastery","b":"v41","g":"1-ObWyVBRQXR4Yt2TRywaelBLE9RPlvAK"},{"id":"18fdf2","s":1391.95,"e":1450.79,"cat":"capacity","r":3,"t":"Everyone has a limit on capacity","k":"We all live in the same construct of time and each has a physical and mental limit; go past it and you collapse. Even with a perfectly designed week Rob gets overwhelmed when he exceeds capacity, and overwhelm degrades decisions and leads to over-correcting, so design your time around your capacity.","q":"capacity, overwhelm, burnout, mental limit, physical limit, over-correcting, decision making, design time","b":"v37","g":"1S6Qw4V1xShy9SSVouAR6O1ZLzfmYjlDJ"},{"id":"5b52b0","s":2053.94,"e":2103.46,"cat":"capacity","r":3,"t":"Trade off work, never health or family","k":"When people run out of capacity, the first trade-offs are always health: meditation, the gym, then diet. Rob now refuses to trade off his life, health or family time, so when he is jammed the trade-offs come out of his allotted work time instead, like pushing a book back a year and turning down a TV show.","q":"trade-offs, capacity, protect balance, health first, saying no, work allotment, harmony, overwhelm","b":"v39","g":"1791F8uQjS-F06qtcXECC1WPqgmEgMWVX"},{"id":"85798d","s":2.29,"e":74.4,"cat":"capacity","r":2,"t":"Stuck stress drains your capacity","k":"Rob says his biggest lesson in five years is mastering his capacity, and the main thing that eats it is stuck stress: money, people, situations you cannot let go of. Overcorrecting just leads to burnout, so clear every source of stress and build systems so it cannot come back.","q":"capacity, stuck stress, burnout, energy drain, reset, systems, free","b":"v36","g":"1zGGXkZKvixSsfbO0Oj-OhS4LGvnz1rhp"},{"id":"2f23db","s":617.51,"e":652.3,"cat":"capacity","r":2,"t":"Weigh second and third order consequences first","k":"When an idea excites you, you usually think only about the idea, not the time, energy and mental capacity it will take or its long tail. Once you commit you can be trapped by it, so think through the second and third order consequences before saying yes.","q":"second order consequences, decision filter, commitments, saying no, time cost, mental capacity, capacity","b":"v37","g":"1r6GhsGbDuFJRj0tg7FVKjnUaPoycLqfE"},{"id":"d207fd","s":2303.12,"e":2410.02,"cat":"capacity","r":2,"t":"Business never calms down, so build harmony first","k":"There is never a calm moment in business: startup, growth and scale each bring more to worry about. Rob designed a balanced life in 2016 that put health first and fit work into it, and argues that if you don't build harmony from the beginning you won't have it when success comes; choose harmony over hustle.","q":"harmony over hustle, balanced life, design life and business, health first, burnout, sustainable success, stress","b":"v37","g":"1lj_u_9Dg66vqKLpdCJRxGs885jU3P2-9"},{"id":"91dbad","s":2592.12,"e":2726.6,"cat":"capacity","r":2,"t":"Define the whole before you say yes","k":"Rob used to say yes to everything because each opportunity might be the one; the problem was he had never defined the whole life he wanted. Once he defined his time, activities, wealth and lifestyle and built the plan backwards, every decision ran through its effect on his energy, and he stopped trading harmony for money or fame.","q":"saying no, define the whole, human why, decision filter, energy, harmony, lifestyle design, plan backwards","b":"v37","g":"1gRDBk7K26ja1tIii0NFbDLJ_gCkZbsY6"},{"id":"7620d8","s":0.0,"e":122.55,"cat":"vision","r":3,"t":"You need a vision for all of you","k":"Everything created starts as a picture in your mind, and you are always deciding who your future self will be. Most people use vision only for a career goal; build a vision for every part of your life and let it evolve as you evolve.","q":"visionary, vision, ideal self, future self, clarity, belief, all aspects of life","b":"v28","g":"1CWB2ZedACHmPZH1DnhhMm7SYW2vsdMVI"},{"id":"42bd74","s":0.0,"e":138.97,"cat":"vision","r":2,"t":"Use imagination to rehearse the future you want","k":"Like Einstein's thought experiments, your mind runs scenarios all day, and most people use it to rehearse worst cases. Notice when you are imagining negative futures, push those thoughts down, and aim your imagination at the best version of your future.","q":"imagination, thought experiments, vision, future self, worst case, negative thoughts, Einstein","b":"v02","g":"10vGJY8IF29DYx-nnilxUF5fnryy6acIr"},{"id":"bfa693","s":3294.52,"e":3470.36,"cat":"vision","r":2,"t":"Stack evolution goals on quantifiable goals","k":"Rob anchors health, life, wealth and work with an evolution goal that keeps growing, then sets measurable goals beneath it, like a target weight. Map the daily actions into your rhythm, track them, and gamify discipline by aiming to hit them about 75 percent of the time; as standards rise the goal evolves.","q":"evolution goals, goal stack, quantifiable goals, gamify discipline, track habits, 75 percent, goal setting, rhythm","b":"v37","g":"1uBrBZPbqeUYYBOng4PexOdCkav3Wj2TQ"},{"id":"d32412","s":3085.38,"e":3123.36,"cat":"vision","r":2,"t":"Goals reveal themselves a third of the way in","k":"You do not go straight to a goal; you expand into it. You can set milestones, but only about a third of the way in do you see everything it will take, and that is where most people either quit or get more motivated by the new clarity.","q":"goals, expand into a goal, milestones, clarity, quit point, vision, motivation, growth","b":"v39","g":"14Rjz3PKROJKVjnNvFFu26d8e2QoKBTwF"},{"id":"f42aad","s":349.72,"e":419.94,"cat":"vision","r":2,"t":"Start at the end and design your whole life","k":"A business book told Rob to decide exactly what a company should become and plan backwards; he realized life works the same way. Ask how you want to live, where, with whom, what money means to you and what you need to be happy, then design life and business together so success in one brings success in the other.","q":"start at the end, plan backwards, design your life, vision, what money means, life and business together","b":"v41","g":"1rKCWLnHR9Q7Ui6UEVl-ljPLg5OhWHfcZ"},{"id":"ddf955","s":4670.41,"e":4772.36,"cat":"vision","r":2,"t":"Design your money to fund the life you want","k":"Rob calls money design a cornerstone of a high-quality life: the balance of what you spend, earn, pay in taxes and save is where peace of mind lives, and spending 50 thousand instead of 80 can build real security in 15 years. You cannot hold high lifestyle expectations without a clear path to earn the money and invest it until you no longer have to.","q":"money design, spend, earn, save, invest, peace of mind, financial freedom, lifestyle","b":"v41","g":"1WYjhkzKP1oeSmkxlSkQEHzOloUbuDpAt"},{"id":"9b6d25","s":0.0,"e":131.1,"cat":"calibrate","r":3,"t":"Calibrate your expectations to what is real","k":"Rob names five lenses people use to form expectations and calls himself a recovering delusional optimist. Unrealistic positivity ends in the same disappointment as unrealistic negativity, so use each experience to adjust expectations toward truth, not toward more positive or less negative.","q":"calibrate, expectations, delusional optimist, realist, pessimist, perspective, truth, disappointment","b":"v01","g":"1eJXTZrraFcAVXtr7yj4rvDcs2O3vm7N3"},{"id":"b57256","s":0.21,"e":127.82,"cat":"info","r":3,"t":"Success and failure are both just information","k":"Success and failure are equal sources of information and neither defines you. Rob's younger self just hustled harder and learned nothing; growth only comes from processing each experience into understanding, otherwise success won't repeat and failure will.","q":"information, success, failure, growth, understanding, awareness, evolution, lessons","b":"v15","g":"1FOScpITsxwV7XRekK_pMh8czNgpLhsPh"},{"id":"504c97","s":0.0,"e":159.06,"cat":"info","r":2,"t":"Advice only lands when you can understand it","k":"An investor told young Rob that capital loves clarity, and he dismissed it; years later he gives that same advice constantly. Information is interpreted through what you already know, so when an experienced person's advice seems wrong, you may not be ready for it yet.","q":"advice, information, foundation, understanding, capital loves clarity, business model, readiness","b":"v17","g":"1BwyTmFLcdZcmR-yXhB_duIXHpMkkYMhf"},{"id":"559bab","s":0.0,"e":147.33,"cat":"info","r":2,"t":"Self-understanding grows because you keep changing","k":"You will never fully understand yourself because the person you are studying keeps changing. Each new understanding expands what you believe is possible, so treat self-understanding as ongoing work that lets you create yourself more intentionally.","q":"self-understanding, know thyself, self-awareness, change, evolve, fulfillment, possibility","b":"v32","g":"1DRvk_tqU5-kHE4__YY0oV6e2ssrEczIT"},{"id":"9b5fac","s":3977.56,"e":4080.07,"cat":"info","r":1,"t":"Reflection is how you control your evolution","k":"Asking yourself how you feel about something forces the reflection that produces insight; if you just hope things improve naturally, you never steer them. Most people stuck in a rut never stop to ask what they could change, so make that self-assessment a core part of your routine.","q":"qualitative data, reflection, self-assessment, awareness, control your evolution, rut, insight","b":"v41","g":"1rMVTm7N8Bt4pAzjWBYxw5iClB5OWZxD5"},{"id":"11d032","s":0.0,"e":175.88,"cat":"passion","r":3,"t":"Passion is created by progressing toward your potential","k":"You are not born with passion; it comes from steadily moving toward your potential. Rob's first half-pipe and the word potential locked him in, and daily progress built the passion, so connect what you do to visible progression and passion follows.","q":"passion, potential, progression, purpose, getting better, skateboarding, motivation","b":"v30","g":"1877h0froNspijPKbcVRIUjkSyYlFBnBF"},{"id":"c9d793","s":3146.22,"e":3183.26,"cat":"passion","r":2,"t":"The joy of life is perpetual evolving","k":"Rob says the real joy of life is living in a balanced, harmonious state while continually evolving toward your potential. Celebrate each milestone for a day, then look at the bigger future it reveals; that steady pursuit becomes a self-generated drip of excitement.","q":"joy of life, harmony, balance, potential, milestones, evolving, progress, passion","b":"v41","g":"1wxFg7z4ukLcIM0km3OZ4mXcuEp8W2Qxs"},{"id":"52aaa9","s":2726.35,"e":2763.84,"cat":"passion","r":1,"t":"Happiness is joy that stays consistent","k":"Rob describes happiness as consistent joy: day after day of activities that each bring joy, sustained over a long stretch. Evolve steadily and in a controlled way rather than in bursts that break that consistency.","q":"happiness, consistent joy, harmony, balance, fulfillment, controlled growth, potential","b":"v37","g":"1uVEA11Ki_Z__V3IKaxwrxFz304WgJ-Hx"}],"cats":[{"k":"os","stage":"found","n":"Your life is an operating system","what":"Your life already runs as a system: what you repeat, where you spend time, the decisions you make and the people around you. That system is producing exactly the results you have now. The goal is not a single outcome. The goal is you, and every change is an upgrade to the system that produces you.","how":["Write down your current system: the routines you repeat, your environments, your recurring decisions and the people you spend the most time with.","Accept that your results today are what that system is built to produce.","Make the goal the best version of you, not a single target.","Pick one part of the system to upgrade this week and treat it as a change to how you run, not a one-time push."]},{"k":"pillars","stage":"found","n":"The four pillars: sleep, life, work, health","what":"Every hour of your week falls into one of four pillars: sleep, life, work or health. Seeing your 168 hours a week as a split across those four, in percentages by day, week and month, is how Rob judges balance. Real balance is not an even split; it is the mix that fits the person you intend to be.","how":["Sort every hour of last week into sleep, life, work and health.","Set a target for each pillar for next week (Rob aims for about 40 hours of work and 7.5 hours of sleep a night).","Look at the split as percentages for each day, the week and the month.","Judge balance by whether the week matched your intention, not by an even split.","Give each pillar its own color so a week reads at a glance."]},{"k":"blocks","stage":"found","n":"Time blocks: you only do 15 to 25 things a day","what":"Time has a structure. Each day is 15 to 25 blocks of time, and only 6 or 7 kinds of activity repeat through the week. You create every one of those blocks. A time block has two layers: the facts you plan (what, when, who, where, which pillar) and the experience you add after it is lived (how it felt, what it meant).","how":["List the 15 to 25 things you did yesterday, then mark the 6 or 7 that repeat all week.","Plan each block with its facts: what, when, who with, where and which pillar.","After a block is lived, add the experience: a rating, a line of reflection, a photo if it matters.","Use clear, specific block titles; they become data you can search and learn from later."]},{"k":"account","stage":"tools","n":"Account for all your time","what":"Most people only track their important time. Rob accounts for all of it, because the quality of your time is the quality of your life and every hour is creating you. Time you don't account for fades, and the person it is creating stays hidden from you.","how":["Record every block as you live it, not just meetings and appointments.","Adjust the calendar during the week so it shows what actually happened, not what you planned.","Keep the record honest, including the late nights, the skipped workouts and the extra hours.","At the end of each week, look at the person your time actually created."]},{"k":"energy","stage":"tools","n":"Rate your energy","what":"After a block is lived, rate how it felt from 0 to 10. It is not a productivity score; it is a read on the experience. Five is neutral, six and up is positive, and four and below is where the information for change lives. Over time the ratings show which people, places and activities raise or drain you.","how":["Rate each block 0 to 10 for how it felt, not how productive it was.","Use 5 as neutral, 6 and up as positive, 4 and below as negative.","For every low score, write down why you felt that way.","Each week, look for patterns in who, where and what produced high and low scores.","Design next week toward the high-energy people and activities and away from the low ones."]},{"k":"record","stage":"tools","n":"Turn your time into a record","what":"The details and meaning of your experiences fade. A short reflection and a photo on the block itself turn time into a record you can come back to. Rob counts his life in years, months, weeks and days created, and backfills the meaningful moments of his past so the record covers his whole life.","how":["On blocks that matter, write a reflection: what you learned, what stood out, what changed your view.","Add a photo or video to moments you want to remember.","Count your life so far in years, months, weeks and days.","Backfill the biggest moments of your past into the record."]},{"k":"friction","stage":"tools","n":"Hunt friction: create, automate, optimize","what":"Rob hunts friction all day. Every time something costs him time, energy or mind share more than once, he builds a solution: he masters it, automates it or hands it to someone, then keeps optimizing until it takes almost no effort. His household and family life run from an 80-page operating document, \"The Rhythm of Existence\". The goal is to drive everything toward energy neutral so his capacity goes to what matters.","how":["Each day, note anything that drained time or energy more than once.","For each one, decide: get good enough that it takes less effort, automate it, or hand it off.","Write down how your recurring life runs (meals, house, errands, family rhythms) so someone else could run it.","If you can hire one person, make it an assistant, and share one live document and a short daily check-in.","Once something is automated, keep optimizing it until it takes almost nothing from you."]},{"k":"align","stage":"week","n":"Real me vs ideal me: the time alignment score","what":"The ideal you is the week you designed; the real you is the week you lived. The time alignment score measures the gap between intention and creation. Rob aims for the 90s, and a miss in either direction counts, even extra hours with family. The gap is not a character flaw; it is information that shows where your week drifted.","how":["Lock in your designed week before it starts so you have something to measure against.","At the end of the week, compare planned and actual hours for each pillar.","Count misses in both directions, over and under.","Find the day the week slipped and the decision that started it.","Use the gap to set next week's design, not to judge yourself."]},{"k":"week","stage":"week","n":"Win the week: design, account, optimize","what":"Life is built week by week, not day by day. Each week is a new version of you and a chance to reset. Rob's cycle has three steps: design the week with intention, account for it as you live it, then use what it revealed to optimize next week's design. Small adjustments repeated every week compound into big change.","how":["Before the week starts, set hours for each pillar and place your recurring blocks (workouts, deep work, family time).","Fill the rest of the week; treat the plan as your intention, not a script.","Account for each block as you live it: adjust, rate and reflect.","At the end of the week, review where intention and reality diverged and what patterns showed up.","Change one or two things in next week's design.","After a bad week, reset and get back to your numbers the next week."]},{"k":"rhythm","stage":"week","n":"Rhythm and momentum beat motivation","what":"Your life already runs in a rhythm of repeated patterns, and that rhythm is what creates you. Motivation rises and falls, so goals built on bursts of effort fade. Put the goal inside your natural rhythm and progress itself keeps you going. Doubt only creeps in when progress slows: first anxiety, then lost faith, then lost belief, and you only quit once belief is gone. Rhythm becomes consistency, consistency becomes discipline, and discipline over time becomes mastery.","how":["Map your current rhythm: what repeats each day, week, month and year.","Put a new goal into recurring blocks inside that rhythm instead of a burst of extra hours.","Measure progress toward the goal every week so momentum replaces motivation.","When progress stalls, find what is slowing you down before doubt sets in.","Avoid the extremes Rob used to live by, like 18-hour days for weeks followed by stopping."]},{"k":"capacity","stage":"mind","n":"Protect your capacity: harmony over hustle","what":"Everyone has a physical and mental limit. Past it, stress gets stuck, decisions get worse and burnout follows. Rob builds harmony into his life first and fits work inside it, because business never calms down on its own. He trades off work time, never health or family, and decides what the whole of his life should look like before he says yes to anything new.","how":["List the things that keep pulling at your mind and clear or systematize them one by one.","Set the hours for family, health and sleep first; fit work into what is left.","When something has to give, cut work time, not health or family.","Before saying yes to a new commitment, ask what it does to the rest of your week and what it leads to next.","Watch for the signs you are past capacity: snapping, poor decisions, nothing left at night."]},{"k":"vision","stage":"mind","n":"You are the visionary of you","what":"Everything starts as a picture in your mind, and you are always deciding who your future self will be. Most people only use vision for a career goal; Rob designs the whole life: how he wants to live, where, with whom, and what money is for. Then he plans backwards and expands into the vision. Your imagination runs thought experiments all day, so aim them at the future you want rather than rehearsing worst cases.","how":["Start at the end: write how you want to live, where, with whom, and what money is for.","Write a short vision for each pillar: sleep, life, work and health, with one or two measurable goals under each.","Plan backwards from that picture to what this year and this week need.","When you catch yourself rehearsing worst-case scenarios, redirect the thought to the outcome you want.","Revisit and update the vision as you learn more about yourself."]},{"k":"calibrate","stage":"mind","n":"Calibrate your expectations to reality","what":"Everyone forms expectations through one of five lenses: delusional pessimist, pessimist, realist, optimist or delusional optimist. Rob calls himself a recovering delusional optimist. Being unrealistically positive ends in the same disappointment as being unrealistically negative. The goal is not more positive or less negative; it is more truthful.","how":["Name which of the five lenses you default to.","When an experienced person pushes back on your idea, treat it as information instead of negativity.","After each experience, adjust your expectations to what turned out to be true.","Ask whether a plan is realistic before you commit, not after it disappoints you."]},{"k":"info","stage":"mind","n":"Everything is information","what":"Success and failure are the same thing: information. Neither defines you. Growth comes from processing experience into understanding; without it, success doesn't repeat and failure keeps repeating. Advice only lands when you have the foundation to understand it, and you will never fully understand yourself because you keep changing.","how":["After any win or loss, write down why it happened.","Turn that lesson into one change you will apply next time.","Revisit advice you once dismissed; you may be ready for it now.","Write down something you understand about yourself today that you didn't five years ago, and what it lets you do now."]},{"k":"passion","stage":"mind","n":"You create passion through progress","what":"You are not born with a passion and you don't find it. Passion comes from continuously moving toward your potential. The activity doesn't create it; the feeling of getting better does. Connect what you do every day to progress you can see, and passion follows.","how":["Choose the potential you want to pursue: an idea, a skill or a part of you to improve.","Track your progress so you can see yourself getting better.","Tie your daily blocks to that potential.","Stop waiting to find a passion; build one through progress."]}],"stages":[{"k":"found","n":"Foundations"},{"k":"tools","n":"The tools"},{"k":"week","n":"The weekly rhythm"},{"k":"mind","n":"Mindset"}],"dkey":"AIzaSyDAcn7073_w7l1O1j84wq5JJTb7XUIcxQo","imgs":[],"ess":["600e30","068b82","0b73c9","72a629","1e4ded","af9dfc","c6736e","682b3c","dd0cac","172967","8be9f4","abd376","6498bd","3a80cd","4af2cc","302f5d","9a3a29","713b67","03c73e","8b5912","7811de","6d1e5a","c9346b","37f77f","1e15d5","ed2765","1147a6","18fdf2","5b52b0","d207fd","91dbad","7620d8","42bd74","d32412","f42aad","9b6d25","b57256","504c97","11d032","c9d793"],"tx":{"v01":[[0.1,"Every person creates expectations of the future through one of five perspectives."],[6.6,"You are either a delusional pessimist, a regular pessimist, a realist, an optimist, or a delusional optimist."],[17.0,"I am a recovering delusional optimist."],[20.0,"And look, that sounds, you know, kind of fun and exciting, but it's not."],[24.7,"You know, I would only see the positive outcome in every idea that I had."],[29.4,"And even when someone would try to explain to me why my idea may not work."],[34.9,"Or wasn't as good as I thought based on their experience, I would just ignore it."],[39.8,"I would be like, oh, you're just being negative."],[42.1,"You're a negative Nancy."],[43.4,"You're a Debbie Downer."],[45.1,"You know, but once I began to pursue that idea and realize that in fact, it was a bad idea and it was not realistic and it was not working."],[55.3,"I was overwhelmed with disappointment from mismanaging that expectation."],[61.8,"Because being unrealistically positive is just as bad as being unrealistically negative, because you always end up in the same place."],[70.6,"You are always disappointed."],[72.9,"Because you never calibrate to what is real, you know."],[76.6,"And the way that you create expectations is based off the way that you perceive the world."],[81.3,"And that perception is just influenced by everything that you've ever experienced."],[85.6,"You know, you've been conditioned by either negative or positive outcomes throughout your life."],[91.9,"And if your perspective is not calibrated to reality, your expectations will continuously move away from truth instead of towards it."],[101.3,"And to create time well, it requires continuously adjusting your expectations to the reality that you're creating."],[108.7,"Every experience gives you new information that refines your understanding of what is true."],[114.3,"Because the goal is not to become more positive or less negative."],[118.3,"The goal is to become more truthful."],[121.1,"When your expectations align with reality, your decisions become clearer, your focus becomes stronger, and your goals become increasingly more achievable."]],"v02":[[0.0,"Your mind can protect you or completely paralyze you."],[4.3,"You know, you can use it to create the path to your dreams, everything you ever wanted."],[9.2,"Or you can use it to design your nightmares."],[12.1,"You know, and the difference isn't your circumstances, it's how you choose to use it."],[16.3,"Albert Einstein famously said that imagination is everything."],[20.0,"It's a preview of life's coming attractions."],[22.1,"And we all know that to be true."],[23.9,"You know, for him, the way you picture the future played a crucial role in shaping his future."],[30.9,"Imagination fuels reality, was his vision and way of thinking."],[36.0,"Most of his breakthroughs were through thought experiments."],[38.8,"Things like general relativity, all these major things that change the way human beings view the universe, were done from his mind first."],[47.5,"And you do the same thing as Einstein, but about your life."],[51.3,"You do thought experiments, you imagine what could happen."],[54.6,"You explore different outcomes, but the problem is many of us use that same ability to rehearse negative futures, preparing for problems that may never happen, playing out these worst-case scenarios over and over again."],[70.2,"And we all do it."],[72.0,"It's just part of human nature, and it's not about never doing it."],[75.9,"It's just about being aware of the impact that it's having on you and your ability to create a positive future."],[83.8,"You know, you're using your mind to create at all times, you know, and it creates either the solution or the problem in all aspects of your life."],[92.8,"It's limitless in its ability to imagine both a positive outcome and a negative outcome."],[100.1,"And these thought experiments that you continuously cycle through, they are a huge part of creating time well."],[107.8,"They lay the foundation for every possible future reality that you'll ever create."],[112.5,"And how you choose to use this tool will shape who you become."],[117.4,"So, whether you realize it or not, your thoughts are always creating the future."],[122.9,"Deny those negative thoughts."],[124.7,"When they pop up, push them down."],[127.6,"Allow the positive thoughts to shape who you become."],[131.6,"The best version of your future."],[134.1,"is theversion where you are the person you know you're meant to create."]],"v03":[[0.0,"This week, the real me, was not the ideal me."],[4.7,"Not the ideal me at all."],[6.0,"Probably the worst me of the entire year."],[9.6,"Probably the lowest week that I had as it relates to my intentionversus my creation."],[16.9,"I mean, look at this."],[18.1,"An 82. I don't know that I've ever even shared an 82 with you guys."],[22.5,"I mean, work."],[23.8,"I barely worked."],[25.1,"You got things to do."],[26.2,"You got dreams to execute."],[27.8,"You got to work."],[28.9,"You got to do the work you're supposed to do."],[31.1,"You want to be healthy."],[32.2,"You want to be strong."],[33.7,"You want to have a clear mind, clear body."],[37.4,"Well, you can't do it if you cancel all of your workouts, all of your meditations, all of your health activities."],[46.8,"Look at this week that's blank."],[49.8,"And look,"],[51.8,"I'm sad. Okay, it was still a fun week."],[54.4,"I had a big adventure."],[55.9,"Went to Cabo for my son's birthday."],[58.2,"Still really enjoyed it, but it wasn't as I intended."],[61.9,"And I know where it started."],[63.5,"It started with my rhythm breaking, right?"],[65.9,"So last week, you know, I still had a great week, you know, but I stayed out super late on this Saturday."],[73.3,"Then going into."],[75.5,"The morning I was exhausted and then overslept."],[78.4,"Now I might have slipped on the diet a little bit."],[81.2,"By the time I got to Cabo on Monday, I had a decision to make when I started golfing."],[87.7,"And that decision was to drink or not drink."],[90.0,"What'd I do?"],[90.8,"Uh-oh, a couple shots at tequila."],[93.2,"And you want to see where the tequila kicks in."],[95.8,"Shot a 43 on the front nine and a tequila 57 on the back nine."],[101.3,"So now I'm sad."],[102.6,"I feel like I'm wasting time."],[104.3,"I felt myself compounding into a worseversion of myself."],[109.6,"Then I really let myself go."],[112.7,"By just not doing any of my health activities, then now I'm exhausted and pushing off the work that I knew I had to do."],[119.5,"But just because I had this off week and I really missed, that doesn't define me."],[126.0,"And in the time creation cycle, you have the ability each week to completely reset."],[131.2,"And that's what I did."],[132.6,"I locked back in and hit my numbers for the following week."],[137.2,"Locked in on work, locked in on health, locked in on life back in the 90s."],[142.4,"And really, that's what the time creation cycle and time alignment is all about."],[146.2,"It is okay."],[147.8,"To be off some weeks, you know, it's just really a matter of how quickly you rebound."],[152.6,"And that's what the time creation cycle is all about."],[155.4,"If you fall out of alignment each week, reset, get locked back in."]],"v04":[[0.1,"Where do all your memories go?"],[2.0,"You know, they're stuck in your head, and if you can recall them or remember them, boy, you find a ton of joy."],[8.0,"But existence locks those memories in forever."],[12.1,"This right here, this is a core memory of mine inside the existence system."],[17.3,"This is a past."],[18.9,"Time block. Okay, and look, this is lunch at the beach club with your family."],[23.6,"It's just an average Sunday afternoon lunch, right?"],[26.3,"On vacation, enjoying life, but it took a twist."],[30.6,"Today's lunch was highlighted by Brianna suggesting that we should be superheroes based on our strengths."],[37.6,"Okay, she took it to the next level with a complete poster of the Ascension League."],[42.9,"This year's Halloween is gonna be amazing."],[46.0,"This was a moment where we decided we were gonna become superheroes at lunch."],[52.4,"And then the wife threw it in chat GPT, built out a poster."],[56.7,"Built out an entire view of who we are based on our strengths."],[61.1,"You know who I am?"],[62.5,"Look at me."],[63.6,"I'm Chronix, the time architect mastering the flow of time."],[70.3,"Because it is my strength."],[71.6,"It is my strength."],[72.8,"But here it is: this is this moment."],[75.2,"where together we were creating these ideas for Halloween on a random Sunday having lunch."],[81.6,"And that image was put into that time block that will be with me forever."],[86.3,"That is the power of using existence for your core memories."]],"v05":[[0.9,"Doubt is preventable as long as you keep progressing."],[6.7,"You know, because when you lose progress, the mind begins to move through the stages of doubt."],[12.6,"And the stages of doubt, they kind of feel like this: you know, when you begin to slow down, you start to feel that anxiety."],[18.2,"You're not moving towards your goal."],[21.2,"You want to achieve, it starts to creep in."],[24.0,"You start to second-guess things."],[26.2,"If you stop making progress, man, that is incredibly dangerous because you start to lose faith, you know."],[33.9,"But when you begin to regress or move backwards, That is when you lose belief."],[41.3,"And when you lose belief, you quit."],[44.5,"That is how it works."],[45.6,"You do not quit anything you are pursuing until you lose belief that you have the ability to actually achieve it."],[53.7,"But doubt, it doesn't begin when you lose belief."],[57.9,"It begins when friction starts slowing your momentum."],[62.0,"You're continuously evolving into the friction that slows your momentum, so you must continuously evolve out of the friction."],[69.6,"Friction is nothing more than information, it tells you where the change is required and where your priorities need to be adjusted."],[77.3,"So when you feel yourself losing progress, you have to find the friction, identify what is creating the most resistance and remove it."],[86.0,"If you continuously evolve out of that friction, you protect your momentum before the doubt has an opportunity to take shape and kill your belief."]],"v06":[[0.3,"This right here, this is the real me."],[4.3,"The person that I created in the week of June 22nd to the 28th, which also happens to be my birthday."],[11.4,"But look, thisversion of me that I created, it was great."],[15.4,"It was amazing, but it is not the ideal me."],[18.0,"It's not theversion of myself that I wish I would have created."],[21.3,"And I know that because my time alignment score is low."],[24.5,"You know, I was supposed to sleep seven and a half hours a night."],[28.1,"I didn't. I slept four hours less."],[30.5,"I wanted to spend 60 hours with my family and life."],[34.8,"Six hours left."],[36.1,"Health, I wanted to do 10 hours, only did seven."],[39.2,"Why? Why, Rob?"],[42.0,"Cause look at that dark, dark number."],[45.0,"I worked 13 hours and 45 minutes more than I had intended."],[52.0,"And look, I needed to do it."],[53.6,"It's part of life."],[54.5,"Like when you're building the company and just running and gunning, you know, sometimes things happen, you gotta dedicate the time to get things done."],[61.7,"And that was the case, but I now have a measurement to understand where I just had an off week."],[67.6,"Now, it doesn't mean."],[68.9,"That it still wasn't fully enjoyable."],[71.0,"You know, I was out golfing, you know, celebrating my birthday with my family."],[76.0,"Where my intention fell off the most was here in the center of the week."],[79.6,"I was supposed to be shooting content here, but instead I had to do back to back to back financial meetings for Studio Deerdeck."],[87.3,"And you gotta understand, I usually spend about two or three hours on Studio Deerdeck each week."],[92.5,"And this right here, this is 20 hours of time."],[96.3,"And that 20 hours of time, that was the difference that really added to that 13 hours and 45 minutes that I overworked."],[103.8,"Because that's what happened."],[104.8,"Life comes at you."],[106.0,"You gotta keep moving."],[107.2,"You gotta be adaptive."],[108.9,"But the beauty of existence is that time alignment score is always giving you a clear indication of whether or not the real you that you're accounting for is the ideal you."]],"v07":[[0.0,"Life is not built moment by moment."],[2.3,"It's not built day by day."],[4.8,"It is built week by week."],[7.4,"And I'm telling you: if you shift your perspective to realize that every week is a completely new me, it will change your life."],[16.3,"And it changed mine because when I first started accounting for all of my time, I began to see the structure of time."],[23.0,"I began to see that, wow, I only do 15 or 20 things each day."],[27.4,"Each day is different, but each week is similar."],[31.9,"And I realized, like, man."],[33.8,"It's not about trying to get better just every day, every moment."],[38.2,"It's not trying to just have long-term plans."],[40.8,"It's like, how do I just incrementally become a better version of myself each week?"],[47.3,"And when I began to do that, it changed my life completely because I began to compound into."],[54.3,"A better and better and better version in a structure that was so much easier for me to follow."],[60.5,"I now understood, like, hey, I'm really trying to win this week because if you win the week, you're gonna win life, you know."],[67.8,"And if I had a bad week at the beginning of each week, it was my chance to reset."],[72.5,"And that's exactly why we created the time creation cycle inside existence."],[77.4,"And it's simple: design your week, account for that lived experience, turn it into data and insights so that you can optimize your next week's design."],[87.3,"That continuous cycle of improvement."],[90.6,"Creates the very best version of yourself."],[92.9,"And it's really simple."],[94.1,"You know, it starts with setting your intention."],[96.5,"And you set your intention by deciding how you want to distribute your time across the four core pillars of sleep, life, health, and work."],[104.2,"And then you have a week."],[105.7,"You decide how you want to plan it at the beginning of the week."],[108.8,"You're just being intentional."],[110.1,"And it's not about."],[111.3,"Planning every single moment and trying to go live exactly as you planned it."],[115.9,"Planning your time is just a projection of your intention."],[119.5,"But life happens and it's incredibly fluid."],[122.0,"So the system is really about accounting for all your time as you live it."],[126.8,"Add context to it, rate it for its quality, reflect on it."],[131.5,"Add media to it to give it deeper dimension."],[134.4,"Turn that time into data, and at the end of the week, you reflect on the person your time actually created."],[141.1,"Existence shows you where your intention and creation are aligned and where they diverge."],[146.0,"And it shows you the patterns that are actually shaping your life."],[149.4,"And you use that insight."],[151.5,"to design the next week better."],[154.5,"And week after week, that cycle compounds."],[157.7,"These small adjustments repeated week over week become massive change over time."]],"v08":[[0.0,"This right here, a calendar invite."],[2.9,"It is basically created so that you can coordinate yourself and others in the future."],[9.6,"And then once that event happens, it's gone into the past, never to be used again."],[15.2,"But existence has time blocks."],[18.2,"To turn your time into the data of you."],[21.1,"So every word in the title, everything in the reflection, everything that you want to add to the time block becomes the data of you."],[30.1,"And in this case, I now have this interesting data about my golfing."],[34.8,"I put in my golf scores."],[36.8,"In every single title."],[38.4,"So I could just simply ask the AI: hey, what do you think my golf handicap is?"],[44.1,"And there it is: Rob's golf handicapestimate for 2026, all the rounds and the scores, handicap calculation based on the world handicap system."],[54.7,"Looks like I'm a 19.5."],[57.5,"But that is the value of the titles inside the existence system."],[62.7,"They are data, they are used for the system to be able to give you information about you."],[69.1,"In my case, my golf handicap, but a calendar and a calendar event."],[74.8,"It's useless and worthless."],[76.6,"As it moves to the past, you'll never use it again."],[79.7,"Where in existence, it is information and data about you that you keep forever and can always reference."]],"v09":[[0.2,"This right here, this is my week of February 1st through February 7th."],[6.1,"But you've never seen my week like this because this is my Miami Vice Week."],[11.9,"Look at these pillars: pink, blue, teal."],[16.9,"This is Rob."],[18.2,"This is Rob."],[19.0,"This feels good to me."],[19.8,"This is like my family colors."],[21.2,"Like, this is the vibe that I want to see on a daily basis."],[25.1,"When you start accounting for all your time and your existence begins to look like this with all these blocks loaded in and the four core pillars: sleep, life, work, health, you want it to look like you."],[38.5,"And what do you look like?"],[39.9,"Do you look like Miami Vice, chill, relaxed, living that tropical lifestyle?"],[43.8,"Or do you look like this?"],[45.5,"You know, do you like those teals and those orange to feel like time creationism and the sun and the moon and the stars?"],[52.1,"Or are you just crazy wild style?"],[55.1,"Crazy wild style."],[56.5,"Maybe you're, I don't know, into the Super Bowl champions and you're like, man, Seahawks for life, now that they want a title again, you could make it anything you want."],[67.0,"Any color, literally any color that you could ever imagine."],[71.5,"That's how dynamic the color picker is."],[74.5,"And like, you can just see this."],[77.1,"Turn it into absolutely any color you want."],[81.2,"You can choose fr
