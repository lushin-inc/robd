 get a million-dollar advance and like, You know, tell your story."],[5717.1,"Like, it's the intent that you even put into big ideas, and then the patience with purpose to allow that idea to evolve and reveal itself to you and be able to know that you're."],[5733.0,"You're building depth in something and trust the process and be willing where the resources come in is pay for that process, right?"],[5741.3,"That's what I'm using my ability to generate cash flow for to be able to."],[5749.2,"Push forward a much bigger, more depth, higher level, higher quality product and project because I have the patience and understanding of what it takes to actually create something great and am willing to put in the time and the effort, even if it pushes"],[5765.4,"out to 2025. You know what I mean?"],[5767.9,"Because I'll be sprite and young and feeling better than ever in my mid-fifties."],[5827.1,"Yeah, everything is Rob Durdick, Rob Durdick.com, Rob Durdick Social, Rob Durdick, everything."],[5832.3,"You know, I was early on, you know, had that name, got it early on in the brand name."],[5836.6,"Everything's Rob Durdick."],[5839.8,"Thank you. Yeah, thank you for having me."],[5841.7,"I really enjoyed it."]]}}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const CLIPS = D.clips, CATS = D.cats, STAGES = D.stages || [], BOOKS = {};
D.books.forEach(b => BOOKS[b.k] = b);
const DKEY = D.dkey || '';
const byId = {}; CLIPS.forEach((c, i) => { c.n = i; byId[c.id] = c; });
const catBy = {}; CATS.forEach((c, i) => { c.i = i; catBy[c.k] = c; });
const ESS = (D.ess || []).map(id => byId[id]).filter(Boolean);
const ls = {get(k, d){ try { const v = localStorage.getItem('rd_' + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
            set(k, v){ try { localStorage.setItem('rd_' + k, JSON.stringify(v)); } catch(e){} }};
const S = {q: '', tab: 'learn', cat: ls.get('cat', ''),
           favs: new Set(ls.get('favs', [])), heard: new Set(ls.get('heard', [])), done: new Set(ls.get('done', [])),
           secs: new Set(ls.get('secs', [])), speed: ls.get('speed', 1), keep: false, open: null};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = t => { t = Math.max(0, Math.round(t)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
const len = c => { const d = Math.round(c.e - c.s); return d < 60 ? d + 's' : Math.floor(d / 60) + 'm ' + String(d % 60).padStart(2, '0') + 's'; };
const total = v => { const t = Math.round(v.reduce((a, c) => a + c.e - c.s + 1, 0) / 60); return t < 60 ? t + ' min' : Math.floor(t / 60) + ' hr ' + (t % 60) + ' min'; };

/* theme */
function applyTheme(t){ if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
applyTheme(ls.get('theme', ''));
$('theme').onclick = () => { const dark = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() === '#121418';
  const t = dark ? 'light' : 'dark'; ls.set('theme', t); applyTheme(t); };

/* routes: #system, #start, #top, #fav, #c-<concept> */
const TABS = {system: 'learn', start: 'start', top: 'top', fav: 'fav'};
function route(){
  const h = location.hash.slice(1);
  if (h.startsWith('c-') && catBy[h.slice(2)]){ S.tab = 'learn'; S.secs.add(h.slice(2)); render(); const el = $('sec-' + h.slice(2)); if (el) el.scrollIntoView(); return; }
  S.tab = TABS[h] || 'learn'; render();
}
window.addEventListener('hashchange', route);
$('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return;
  const h = Object.keys(TABS).find(k => TABS[k] === b.dataset.t); if (location.hash === '#' + h) route(); else location.hash = h; window.scrollTo(0, 0); };
$('cats').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; S.cat = b.dataset.c; ls.set('cat', S.cat); render(); };
let qt; $('q').oninput = e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim().toLowerCase(); render(); }, 120); };

/* search index: titles, takeaways, keywords and the spoken text */
const TX = D.tx || {};
Object.values(TX).forEach(L => L.forEach(x => x.push(x[1].toLowerCase())));
function firstAt(L, t){ let lo = 0, hi = L.length; while (lo < hi){ const m = (lo + hi) >> 1; if (L[m][0] < t) lo = m + 1; else hi = m; } return lo; }
CLIPS.forEach(c => {
  const L = TX[c.b] || []; c.si = firstAt(L, c.s - 0.5); let i = c.si;
  while (i < L.length && L[i][0] < c.e - 0.5) i++; c.ei = i;
  c.hay = [c.t, c.k, (catBy[c.cat] || {}).n || '', BOOKS[c.b].n, c.q || ''].join(' ').toLowerCase();
  c.said = L.slice(c.si, c.ei).map(x => x[2]).join(' ');
});
const qWords = () => S.q ? S.q.split(/\s+/).filter(Boolean) : [];
function hl(text, words){
  let s = esc(text);
  words.forEach(w => { const r = new RegExp('(' + esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'); s = s.replace(r, '<mark>$1</mark>'); });
  return s;
}
function saidLine(c, words){
  if (!words.length || words.every(w => c.hay.includes(w))) return null;
  const L = TX[c.b] || [], ph = words.join(' ');
  for (let i = c.si; i < c.ei; i++) if (L[i][2].includes(ph)) return L[i];
  return null;
}
const matches = c => { const w = qWords(); return !w.length || w.every(x => c.hay.includes(x)) || c.said.includes(w.join(' ')); };
const inCat = c => !S.cat || c.cat === S.cat;
const byCourse = (a, b) => (catBy[a.cat].i - catBy[b.cat].i) || (b.r - a.r) || (a.n - b.n);
function visible(){
  if (S.q) return CLIPS.filter(c => matches(c) && inCat(c)).sort(byCourse);
  if (S.tab === 'start') return ESS.filter(inCat);
  if (S.tab === 'top') return CLIPS.filter(c => c.r === 3 && inCat(c)).sort(byCourse);
  if (S.tab === 'fav') return CLIPS.filter(c => S.favs.has(c.id) && inCat(c)).sort(byCourse);
  return CLIPS.slice().sort(byCourse);
}
const catClips = k => CLIPS.filter(c => c.cat === k).sort((a, b) => (b.r - a.r) || (a.n - b.n));

const STAR = '<svg class="i" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>';
const PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>';
const PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
const CHEV = '<svg class="i chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';
const RIGHT = '<svg class="i" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>';
const TICK = '<svg class="i" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>';
function snipHTML(c){
  const w = qWords(), x = saidLine(c, w);
  return x ? '<span class="snip">' + hl(x[1], [w.join(' ')]) + '</span>' : '';
}
function clipHTML(c, num){
  const playing = P.cur === c && !au.paused;
  return '<li class="clip' + (P.cur === c ? ' on' : '') + (S.heard.has(c.id) ? ' done' : '') + (S.open === c.id ? ' open' : '') + '" data-id="' + c.id + '">' +
    '<div class="row"><button class="pb" data-a="play" aria-label="Play">' + (playing ? PAUSE : PLAY) + '</button>' +
    '<button class="tx" data-a="open"><span class="ti">' + (num ? num + '. ' : '') + esc(c.t) + '</span><span class="mt">' +
    '<span>' + len(c) + '</span><span>' + esc(BOOKS[c.b].s || BOOKS[c.b].n) + '</span>' + (c.r === 3 && S.tab !== 'top' ? '<span class="best">Top clip</span>' : '') +
    '</span>' + snipHTML(c) + '</button>' +
    '<button class="st' + (S.favs.has(c.id) ? ' on' : '') + '" data-a="fav" aria-label="Favorite">' + STAR + '</button></div>' +
    '<div class="more"><p class="kw">' + esc(c.k) + '</p>' +
    '<div class="acts"><span style="color:var(--muted)">' + esc(BOOKS[c.b].n) + ' at ' + fmt(c.s) + '</span>' +
    '<button data-a="heard">' + (S.heard.has(c.id) ? 'Mark unheard' : 'Mark heard') + '</button></div></div></li>';
}
function groupedHTML(v, numbered){
  let h = '', k = null, n = 0;
  v.forEach(c => {
    const g = numbered ? (catBy[c.cat].stage) : c.cat;
    if (g !== k){ if (k !== null) h += '</ul>'; k = g;
      h += '<div class="ch">' + esc(numbered ? (STAGES.find(s => s.k === g) || {n: g}).n : catBy[g].n) + '</div><ul class="list">'; }
    h += clipHTML(c, numbered ? ++n : 0); });
  return h + '</ul>';
}
function systemHTML(){
  let h = '<div class="h2">The System</div><ol class="flow">', st = null;
  CATS.forEach((c, i) => {
    if (c.stage !== st){ st = c.stage; h += '<li class="stg">' + esc((STAGES.find(s => s.k === st) || {n: st}).n) + '</li>'; }
    else h += '<li class="con" aria-hidden="true"></li>';
    h += '<li><button class="fl" data-a="goto" data-k="' + c.k + '"><span class="fn">' + (i + 1) + '</span><span class="ft">' + esc(c.n) + '</span>' + RIGHT + '</button></li>';
  });
  h += '</ol><div class="h2">The ideas</div>';
  CATS.forEach((c, i) => {
    const open = S.secs.has(c.k), v = catClips(c.k);
    h += '<section class="sec' + (open ? ' open' : '') + '" id="sec-' + c.k + '"><button class="sech" data-a="sec" data-k="' + c.k + '"><span class="fn">' + (i + 1) + '</span><span class="secn">' + esc(c.n) + '</span>' + CHEV + '</button>';
    if (open){
      h += '<div class="secb"><p class="what">' + esc(c.what) + '</p><div class="lab">How to apply it</div><ul class="how">' +
        c.how.map((x, j) => { const id = c.k + j; return '<li class="' + (S.done.has(id) ? 'ok' : '') + '"><button class="ck" data-a="ck" data-h="' + id + '" aria-label="Done">' + TICK + '</button><span>' + esc(x) + '</span></li>'; }).join('') + '</ul>';
      if (v.length) h += '<div class="robh"><div class="lab">Rob explains it</div><button class="playall" data-a="playsec" data-k="' + c.k + '">' + PLAY.replace('<svg', '<svg class="i" fill="currentColor"') + '<span>Play section</span></button></div><ul class="list">' + v.map(x => clipHTML(x)).join('') + '</ul>';
      h += '</div>';
    }
    h += '</section>';
  });
  return h;
}
let momLimit = 30, momLast = '';
function moments(){
  const words = qWords(); if (!words.length || S.q.length < 3) return [];
  const ph = words.join(' '), out = [];
  D.books.forEach(b => (TX[b.k] || []).forEach(x => { if (x[2].includes(ph)) out.push({b: b.k, t: x[0], x: x[1]}); }));
  return out;
}
function momentsHTML(){
  if (S.q !== momLast){ momLast = S.q; momLimit = 30; }
  const m = moments(); if (!m.length) return '';
  const w = [qWords().join(' ')];
  let h = '<div class="momh">Everywhere it\'s said</div><p class="momsub">' + m.length + (m.length === 1 ? ' moment' : ' moments') + '</p><ul class="list">';
  m.slice(0, momLimit).forEach(x => {
    const on = P.cur && P.cur.mom && P.cur.b === x.b && P.cur.s === x.t;
    h += '<li class="clip mom' + (on ? ' on' : '') + '" data-mb="' + x.b + '" data-mt="' + x.t + '"><div class="row"><button class="pb" data-a="moment" aria-label="Play from here">' + (on && !au.paused ? PAUSE : PLAY) + '</button>' +
      '<button class="tx" data-a="moment"><span class="ti">' + hl(x.x, w) + '</span><span class="mt"><span>' + esc(BOOKS[x.b].s || BOOKS[x.b].n) + '</span><span>' + fmt(x.t) + '</span></span></button></div></li>';
  });
  h += '</ul>';
  if (m.length > momLimit) h += '<button class="morebtn" data-a="moremom">Show more</button>';
  return h;
}
function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', !S.q && b.dataset.t === S.tab));
  const chipsOn = S.q || S.tab !== 'learn';
  $('cats').hidden = !chipsOn;
  document.querySelectorAll('#cats .chip').forEach(b => b.classList.toggle('on', b.dataset.c === S.cat));
  const v = visible(); let h = '';
  $('playall').hidden = !S.q && (S.tab === 'learn' || (S.tab === 'start' && !S.cat));
  $('playall').querySelector('span').textContent = 'Play all ' + v.length;
  $('lbl').textContent = S.q ? v.length + (v.length === 1 ? ' clip' : ' clips') : S.tab === 'learn' ? '' : total(v);
  const card = !S.q && S.tab === 'start' && !S.cat;
  if (card) $('lbl').textContent = '';
  $('bar2').hidden = !$('lbl').textContent && $('playall').hidden;
  if (S.q){ h = v.length ? '<ul class="list">' + v.map(c => clipHTML(c)).join('') + '</ul>' : '<p class="empty">No clips match.</p>'; h += momentsHTML(); }
  else if (S.tab === 'learn') h = systemHTML();
  else if (!v.length) h = '<p class="empty">' + (S.tab === 'fav' ? 'Tap the star on any clip to save it here.' : 'No clips match.') + '</p>';
  else h = (S.tab === 'start' && !S.cat ? '<button class="start" data-a="ess"><span class="big">' + PLAY + '</span><span><b>Play the Essentials</b><span>' + v.length + ' clips in course order, ' + total(v) + '</span></span></button>' : '') + groupedHTML(v, S.tab === 'start');
  $('list').innerHTML = h;
  refreshPlayState();
}
$('cats').innerHTML = '<button class="chip" data-c="">Everything</button>' +
  CATS.map(c => '<button class="chip" data-c="' + c.k + '">' + esc(c.n) + '</button>').join('');
function refreshPlayState(){
  document.querySelectorAll('#list .clip[data-id]').forEach(li => { const c = byId[li.dataset.id], on = !!c && P.cur === c;
    li.classList.toggle('on', on); const pb = li.querySelector('.pb'); if (pb) pb.innerHTML = on && !au.paused ? PAUSE : PLAY; });
  document.querySelectorAll('#list .mom').forEach(li => { const on = !!(P.cur && P.cur.mom && P.cur.b === li.dataset.mb && P.cur.s === +li.dataset.mt);
    li.classList.toggle('on', on); li.querySelector('.pb').innerHTML = on && !au.paused ? PAUSE : PLAY; });
}
$('list').onclick = e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'ess'){ const v = visible(); if (v.length) start(v, v[0]); return; }
  if (a === 'moremom'){ momLimit += 30; render(); return; }
  if (a === 'goto'){ location.hash = 'c-' + b.dataset.k; if (location.hash === '#c-' + b.dataset.k) route(); return; }
  if (a === 'sec'){ const k = b.dataset.k; S.secs.has(k) ? S.secs.delete(k) : S.secs.add(k); ls.set('secs', [...S.secs]); render(); return; }
  if (a === 'ck'){ const id = b.dataset.h; S.done.has(id) ? S.done.delete(id) : S.done.add(id); ls.set('done', [...S.done]); render(); return; }
  if (a === 'playsec'){ const v = catClips(b.dataset.k); if (v.length) start(v, v[0]); return; }
  if (a === 'moment'){ const li = b.closest('.mom'); playMoment(li.dataset.mb, +li.dataset.mt); return; }
  const li = b.closest('.clip'); if (!li) return;
  const c = byId[li.dataset.id];
  if (a === 'play'){ if (P.cur === c){ au.paused ? au.play() : au.pause(); }
    else { const sec = b.closest('.sec'); start(sec ? catClips(sec.id.slice(4)) : visible(), c); } }
  else if (a === 'open'){ S.open = S.open === c.id ? null : c.id; render(); }
  else if (a === 'fav'){ S.favs.has(c.id) ? S.favs.delete(c.id) : S.favs.add(c.id); ls.set('favs', [...S.favs]); render(); }
  else if (a === 'heard'){ S.heard.has(c.id) ? S.heard.delete(c.id) : S.heard.add(c.id); ls.set('heard', [...S.heard]); render(); }
};

/* player: on the Mac it plays the source video's audio from this folder; anywhere else (or if that file
   is missing) it plays each clip's own file from Google Drive. */
const au = $('au');
const P = {queue: [], i: -1, cur: null, mode: location.protocol === 'file:' ? 'full' : 'clip', off: 0, file: null};
const fullSrc = c => BOOKS[c.b].file.split('/').map(encodeURIComponent).join('/');
const clipSrc = c => 'https://www.googleapis.com/drive/v3/files/' + c.g + '?alt=media&key=' + DKEY;
if (!DKEY) P.mode = 'full';
const bt = () => au.currentTime + P.off;
function seekPlay(t){
  const go = () => { au.currentTime = Math.max(0, t); au.playbackRate = S.speed; au.play().catch(() => {}); };
  if (au.readyState >= 1) go(); else au.addEventListener('loadedmetadata', go, {once: true});
}
au.addEventListener('error', () => {
  if (P.mode === 'full' && DKEY && P.cur){ P.mode = 'clip'; P.file = null; if (P.cur.mom) playMoment(P.cur.b, P.cur.s); else if (P.cur.g) play(P.cur); return; }
  $('err').innerHTML = '<p class="err">The audio did not load. On your Mac, keep this page in the Rob Dyrdek folder, next to the videos.</p>';
});
function playMoment(b, t){
  if (P.cur && P.cur.mom && P.cur.b === b && P.cur.s === t){ au.paused ? au.play() : au.pause(); return; }
  if (P.mode === 'full'){
    const m = {mom: true, id: 'm', b, s: t, e: t + 7200, t: 'From ' + fmt(t), g: ''};
    P.queue = [m]; P.i = 0; play(m, Math.max(0, t - 0.4));
  } else {
    const inClip = CLIPS.filter(x => x.b === b && x.s <= t + 0.5 && x.e > t), c = inClip.find(x => x.g);
    if (!c){ $('err').innerHTML = '<p class="err">' + (inClip.length ? 'That clip is not on Google Drive yet' : 'That moment is not inside a clip') + ', so it only plays on your Mac.</p>'; return; }
    P.queue = [c]; P.i = 0; play(c, Math.max(c.s, t - 0.4));
  }
}
function start(queue, c){ P.queue = queue; P.i = queue.indexOf(c); play(c); }
function play(c, at){
  P.cur = c; P.at = at == null ? c.s : at; S.keep = !!c.mom; $('err').innerHTML = '';
  if (P.mode === 'full'){
    const f = fullSrc(c);
    if (P.file !== f){ au.src = f; au.load(); P.file = f; }
    P.off = 0; seekPlay(P.at);
  } else if (c.g) {
    P.off = c.s; P.file = null; au.src = clipSrc(c); au.load(); seekPlay(P.at - c.s);
  } else {
    $('err').innerHTML = '<p class="err">This clip is not on Google Drive yet, so it only plays on your Mac.</p>';
    if (P.queue.length > 1) setTimeout(() => step(1), 1200);
  }
  $('player').hidden = false; showPlayer(); refreshPlayState(); media(c);
}
function step(d){
  const j = P.i + d;
  if (j >= 0 && j < P.queue.length){ P.i = j; play(P.queue[j]); }
  else if (d > 0){ au.pause(); P.i = -1; showPlayer(); render(); }
}
function finish(){
  if (!P.cur) return;
  if (!P.cur.mom && !S.heard.has(P.cur.id)){ S.heard.add(P.cur.id); ls.set('heard', [...S.heard]); }
  if (P.queue.length > 1 && P.i + 1 < P.queue.length) step(1); else { au.pause(); render(); }
}
au.addEventListener('timeupdate', () => {
  const c = P.cur; if (!c) return;
  const t = bt();
  if (P.mode === 'full' && !S.keep && t >= c.e) { finish(); return; }
  const span = S.keep ? Math.max(c.e, t) - c.s : c.e - c.s;
  $('pfill').style.width = Math.min(100, (t - c.s) / span * 100) + '%';
  $('pcur').textContent = fmt(t - c.s);
});
au.addEventListener('ended', () => finish());
au.addEventListener('play', () => { $('ppi').innerHTML = PAUSE.replace(/<\/?svg[^>]*>/g, ''); refreshPlayState(); });
au.addEventListener('pause', () => { $('ppi').innerHTML = PLAY.replace(/<\/?svg[^>]*>/g, ''); refreshPlayState(); });
function showPlayer(){
  const c = P.cur; if (!c) return;
  $('ptitle').textContent = c.mom ? BOOKS[c.b].n + ' from ' + fmt(c.s) : c.t; $('plen').textContent = c.mom ? '' : fmt(c.e - c.s);
  $('pq').textContent = P.queue.length > 1 && P.i >= 0 ? (P.i + 1) + ' of ' + P.queue.length : (c.mom ? '' : (catBy[c.cat] || {}).n || '');
  $('keep').hidden = P.mode !== 'full';
  $('keep').classList.toggle('on', S.keep); $('speed').textContent = S.speed + 'x';
}
$('pp').onclick = () => { if (!P.cur) return; au.paused ? au.play() : au.pause(); };
$('back').onclick = () => { au.currentTime = Math.max(P.mode === 'full' && P.cur ? P.cur.s - 30 : 0, au.currentTime - 15); };
$('fwd').onclick = () => { au.currentTime = au.currentTime + 15; };
$('prev').onclick = () => { if (P.cur && bt() - P.cur.s > 4) au.currentTime = P.cur.s - P.off; else step(-1); };
$('next').onclick = () => step(1);
$('keep').onclick = () => { S.keep = !S.keep; showPlayer(); };
const SPEEDS = [1, 1.25, 1.5, 1.75, 2];
$('speed').onclick = () => { S.speed = SPEEDS[(SPEEDS.indexOf(S.speed) + 1) % SPEEDS.length]; au.playbackRate = S.speed; ls.set('speed', S.speed); showPlayer(); };
$('prog').onclick = e => { const c = P.cur; if (!c) return; const r = e.currentTarget.getBoundingClientRect();
  au.currentTime = c.s - P.off + (e.clientX - r.left) / r.width * (c.e - c.s); };
$('playall').onclick = () => { const v = visible(); if (v.length) start(v, v[0]); };
function media(c){
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({title: c.mom ? BOOKS[c.b].n + ' from ' + fmt(c.s) : c.t, artist: 'Rob Dyrdek', album: c.mom ? BOOKS[c.b].n : ((catBy[c.cat] || {}).n || '')});
  navigator.mediaSession.setActionHandler('nexttrack', () => step(1));
  navigator.mediaSession.setActionHandler('previoustrack', () => step(-1));
}
route();
</script>
</body>
</html>
